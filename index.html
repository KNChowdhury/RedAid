<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Applied synchronously, before any CSS/React loads, so a returning
         dark-mode user never sees a flash of the light theme. Light is the
         brand default regardless of OS preference -- only an explicit
         in-app toggle (which writes 'theme' to localStorage) switches a
         visitor to dark. Mirrors src/hooks/useTheme.ts, which just reads
         the class this script already set. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Browser tab icon + mobile home-screen icon. Generated from
         public/brand/rbb-icon.svg by scripts/generate-brand-assets.js.
         iOS ignores SVG touch icons, hence the PNG. -->
    <!-- Google Analytics 4 (G-QJMFLXSYTK). Privacy rules, keep them:
         - Never load on auth landing URLs: magic-link / password-reset links
           carry access_token / code / type=recovery in the URL, and GA would
           send the full URL to Google.
         - page_location is sent without query string or hash.
         - Production host only, so local/preview traffic isn't counted.
         - "Outbound clicks" must stay OFF in GA's Enhanced measurement:
           donor call/WhatsApp links contain phone numbers (tel:/wa.me). -->
    <script>
      (function () {
        var url = location.search + location.hash;
        var isAuthUrl = /access_token|refresh_token|[?&#]code=|type=recovery|error_description/.test(url);
        var isProd = location.hostname === 'redaidbd.vercel.app';
        if (isAuthUrl || !isProd) return;
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag('js', new Date());
        gtag('config', 'G-QJMFLXSYTK', { page_location: location.origin + location.pathname });
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-QJMFLXSYTK';
        document.head.appendChild(s);
      })();
    </script>
