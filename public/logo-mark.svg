<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
  </defs>

  <!-- White field with a soft rose edge so the badge still reads as a
       distinct card on a white navbar, not just blank space. -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="#FFFFFF" stroke="#FECDD3" stroke-width="2"/>

  <path d="M32 7
           C38.5 15 42 19.5 42 26
           A10 10 0 1 1 22 26
           C22 19.5 25.5 15 32 7 Z"
        fill="url(#drop)"/>

  <path d="M25 29 L28 29 L30 32.5 L33 22.5 L36 29 L39 29"
        fill="none" stroke="#FFFFFF" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <ellipse cx="27" cy="18" rx="2.5" ry="3.8" fill="#FFFFFF" opacity="0.4"
           transform="rotate(-18 27 18)"/>

  <!-- Gradient-filled wordmark ties the text to the drop's color instead
       of sitting flat black, plus a thin rule under it as a finishing
       mark, so it reads as a designed lockup, not a plain label. -->
  <text x="32" y="53" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="15" letter-spacing="0.5" fill="url(#drop)">RBB</text>
  <rect x="20" y="57" width="24" height="2" rx="1" fill="url(#drop)"/>
</svg>
